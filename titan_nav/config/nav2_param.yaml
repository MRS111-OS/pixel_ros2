amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    min_particles: 500
    max_particles: 2000

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 1.5

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/gagasaga/titan_ws/src/titan_nav/maps/warehouse_map.yaml

planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 0.0   # IMPORTANT: disable continuous replanning for benchmarking

    planner_plugins: ["GridBased"]

    NavFn:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: true

