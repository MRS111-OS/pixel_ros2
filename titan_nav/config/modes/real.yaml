/**:
  ros__parameters:
    use_sim_time: false

# A physical depth PointCloud2 topic has not been verified. Restore the
# upstream LiDAR-only local costmap so lidar_depth mode:=real does not claim to
# consume an unverified hardware sensor.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "inflation_layer"]
      # Null removes the simulation-only voxel block during the deep merge.
      voxel_layer: null
